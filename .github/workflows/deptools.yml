name: Dependency scan
on:
  push:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: deptools-io/scan-action@v1
        with:
          project-id: ${{ vars.DEPTOOLS_PROJECT_ID }}
          api-key: ${{ secrets.DEPTOOLS_API_KEY }}
          sbom-format: cyclonedx   # waits for the analysis, then downloads its SBOM
          timeout: 1800            # max wait in seconds (default 300)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: deptools-sbom.cdx.json
          if-no-files-found: warn
